name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tasks/Task_7/task_manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Tasks/Task_7/task_manager/go.mod
          cache-dependency-path: Tasks/Task_7/task_manager/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...
